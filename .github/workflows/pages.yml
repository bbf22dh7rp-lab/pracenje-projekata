name: Objavi aplikaciju

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi sadržaj
        uses: actions/checkout@v4
      - name: Podesi GitHub Pages
        uses: actions/configure-pages@v5
      - name: Pripremi stranicu
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Objavi
        id: deployment
        uses: actions/deploy-pages@v4
